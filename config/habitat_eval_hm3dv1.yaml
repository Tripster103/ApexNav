defaults:
  - /benchmark/nav/objectnav:
      - objectnav_hm3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    split: val
    data_path: data/datasets/objectnav/hm3d/v1/{split}/{split}.json.gz # HM3D-v1 dataset
  environment:
    max_episode_steps: 500
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      gps_sensor:
        type: GPSSensor
        dimensionality: 3
    measurements:
      success:
        success_distance: 0.2
  simulator:
    habitat_sim_v0:
      allow_sliding: false
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        radius: 0.18
        sim_sensors:
          depth_sensor:
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true

detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

  # NOTE: owlv2 is not meaningful on this dataset, and rescaling c_th would not
  # change that. All six HM3D-ObjectNav goals (couch, tv, chair, toilet, bed,
  # potted plant) are COCO classes, so get_object()'s fork sends every one to
  # YOLOv7 -- slot 0 never sees the open-vocabulary detector. Swapping it would
  # only affect the similar-object channel feeding slots 1+. Use ovon (161/177
  # categories DINO_ONLY) or mp3d (13/21) for the ablation.
  # Which open-vocabulary detector runs. 'groundingDINO' (default, the shipped
  # baseline) or 'owlv2'. Flip this to switch arms -- no source edit.
  backend: groundingDINO

  owlv2:
    # NOT interchangeable with confidence_threshold_dino. OWLv2's median
    # detection scores 0.081 against GroundingDINO's 0.256; 0.25 is the matched
    # operating point that equalises detection volume with GDINO's 0.40.
    # Sweep 0.15 / 0.20 / 0.25 / 0.35. See analysis/detector/FINDINGS.md.
    confidence_threshold_owlv2: 0.25
    # No text_threshold: it gates GroundingDINO's phrase-grounding step, which
    # OWLv2 does not have. The key would be dead rather than transferable.

llm:
  llm_answer_path: llm/answers/llm_answer_hm3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: ollama # deepseek, ollama or none
    ollama: "qwen3:8b"

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_hm3dv1_{split}"
test_epi_num: -1
