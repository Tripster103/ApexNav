# Authored by Claude (Anthropic Claude Opus 5) for Broden Tripcony.
defaults:
  - /benchmark/nav/objectnav:
    - objectnav_ovon
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    # Default split — override per run without touching this file:
    #   +hydra overrides on the sbatch command line, e.g.
    #   habitat.dataset.split=val_seen_synonyms
    #   habitat.dataset.split=val_unseen
    split: val_seen
    data_path: data/datasets/objectnav/ovon/hm3d/{split}/{split}.json.gz
  environment:
    max_episode_steps: 500
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      gps_sensor:
        type: GPSSensor
        dimensionality: 3
    measurements:
      success:
        # 0.25, not the 0.2 used by our hm3dv1/hm3dv2/mp3d configs -- this is
        # HM3D-OVON's own evaluation protocol, so it is benchmark-defined rather
        # than method-defined. Verified 2026-08-11: every success_distance in the
        # OVON repo is 0.25 (8 occurrences across config/experiments/*.yaml, plus
        # ovon/utils/visualize_trajectories.py:144 which sets it unconditionally
        # in Python). No competing value exists anywhere in their codebase, and it
        # sits under task.measurements rather than under agents, so it applies to
        # the LoCoBot embodiment just as it does to Stretch.
        # NOTE for the write-up: this makes OVON's threshold differ from the other
        # three datasets. That is each benchmark using its own protocol, not an
        # inconsistency -- but it must be stated explicitly in the methodology,
        # since SR is not directly comparable across columns at different radii.
        success_distance: 0.25
      distance_to_goal:
        # OVON's own measure, not habitat's stock DistanceToGoal. Every one of the
        # six config/experiments/*.yaml in the OVON repo sets exactly this line, so
        # it is what their reported Table III numbers were produced with.
        #
        # Easy to miss: OVONDistanceToGoalConfig is defined in ovon/config.py but
        # never cs.store()d, so the only thing that selects the measure is this
        # `type` override on habitat's stock config node. Without it we silently
        # get habitat's DistanceToGoal, which is what every ApexNav OVON run before
        # 2026-08-20 used.
        #
        # The difference (ovon/measurements/nav.py:45-59): OVONDistanceToGoal adds
        # the episode's `children_object_categories` view points to the candidate
        # set, so a `table` episode also succeeds on a `desk`, `cloth` on a `towel`,
        # `sink` on a `washbasin`. 149 of the 3000 val_seen episodes (5.0%) have a
        # non-empty children list -- 94 of them table->desk. All 174 child lookups
        # resolve against goals_by_category (0 misses), adding a median +50% more
        # view points to those episodes. Extra view points can only lower the min
        # geodesic distance, so stock DistanceToGoal is strictly STRICTER than the
        # benchmark, never more lenient.
        #
        # `distance_to` is inherited as VIEW_POINTS from habitat's objectnav.yaml
        # and OVONDistanceToGoal reads only that field, so no new config node is
        # needed. Registration is handled by `import ovon.measurements.nav` in
        # habitat_evaluation.py's __main__ -- ovon/__init__.py has that import
        # commented out.
        type: OVONDistanceToGoal
  simulator:
    # Pinned explicitly rather than left to ovon's cs.store override of
    # habitat_config_base, so this file states the embodiment it is running.
    type: "OVONSim-v0"
    # DO NOT add `tilt_angle` here. OVON's stretch task config has it
    # (objectnav_stretch_hm3d.yaml:16), but this habitat-lab has no such key on
    # SimulatorConfig -- tilt_angle belongs to DiscreteNavigationActionConfig
    # (default_structured_configs.py:162), while turn_angle is the one that does
    # live on SimulatorConfig (:1727). Setting it fails composition outright:
    #   ConfigKeyError: Key 'tilt_angle' not in 'OVONSimulatorConfig'
    # (killed job 58962681, 2026-08-11). OVON's configs target a different
    # habitat-lab revision than the one vendored here.
    # Nothing is lost: the live path is LookUpAction._tilt_angle = config.tilt_angle
    # (nav.py:1047) reading task.actions.look_up.tilt_angle, which habitat's
    # objectnav.yaml already sets to 30 -- matching ApexNav's hardcoded np.pi/6
    # in habitat_evaluation.py:499. Pitch is already 30 degrees per step.

    # OVONSim-v0 (selected via ovon's cs.store override of habitat_config_base)
    # THROWS AWAY each scene's shipped *.basis.navmesh and recomputes it on init
    # and on every scene change -- ovon/task/simulator.py:12,38. So these two
    # values are not cosmetic: they define the navmesh we actually navigate.
    #
    # Without this block we inherit OVONSimulatorConfig's defaults of 0.2/0.2
    # (ovon/config.py:120-121), which are dead values -- all six OVON experiment
    # configs override them to 0.1/0.05 and nothing in their repo runs the
    # defaults. cell_height 0.2 -> 0.05 is the one that matters: a 4x coarser
    # voxelisation merges thin geometry, drops narrow passages, and changes island
    # connectivity, so OVON episode start positions verified navigable on their
    # navmesh can get silently snapped elsewhere and goals can become unreachable.
    # That inflates failures for reasons unrelated to ApexNav. Correctness fix,
    # not a fairness one.
    #
    # Note agent_max_climb 0.2 -> 0.1 REDUCES connectivity, so this block is not
    # expected to raise SR on its own. The recompute also reads agent height/radius
    # from agents.main_agent below (0.88/0.18, the LoCoBot body we are keeping), so
    # this aligns OVON's discretisation, not their embodiment.
    navmesh_settings:
      agent_max_climb: 0.1
      cell_height: 0.05
    habitat_sim_v0:
      allow_sliding: false
    forward_step_size: 0.25
    turn_angle: 30
    # OVON's Stretch embodiment, from ovon/config/tasks/objectnav_stretch_hm3d.yaml
    # (the task config all six of their experiment YAMLs include). This is the
    # embodiment the HM3D-OVON paper's Table III was produced with, so it is the
    # only one whose numbers can sit next to published results (e.g. VLFM).
    # Overrides the LoCoBot body inherited from benchmark/nav/objectnav/objectnav_ovon.yaml
    # (0.88/0.18, camera at 0.88, 640x480, hfov 79) -- that config mirrors
    # objectnav_hm3d.yaml, which is the standard HM3D-ObjectNav LoCoBot spec.
    # NOTE the sensor is PORTRAIT: width 360, height 640. Not a typo, not reversed.
    agents:
      main_agent:
        height: 1.41
        radius: 0.17
        sim_sensors:
          rgb_sensor:
            position: [0.0, 1.31, 0.0]
            width: 360
            height: 640
            hfov: 42
          # OVON's stretch config is rgb_agent -- it defines NO depth sensor,
          # because their policy is RGB-only. ApexNav needs depth, so this block
          # necessarily mirrors the RGB frustum rather than matching an OVON spec.
          # min/max depth stay at ApexNav's perception range (method, not benchmark).
          depth_sensor:
            position: [0.0, 1.31, 0.0]
            width: 360
            height: 640
            hfov: 42
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true

detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

llm:
  llm_answer_path: llm/answers/llm_answer_ovon_claude.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: ollama # deepseek, ollama, or none -- irrelevant while every
                        # OVON category is covered by llm_answer_ovon_claude.txt,
                        # since read_answer() checks the cache before ever
                        # dispatching to a live client (see notes/2026-07-28.md)
    ollama: 'qwen3:8b'

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_ovon_{split}"
test_epi_num: -1
